[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "writegenius"
version = "0.1.0"
description = "Multilingual Natural Language Processing & Readability Engine for European Languages"
readme = "README.md"
authors = [
    { name = "spiktokmarcin-rgb", email = "spiktokmarcin-rgb@users.noreply.github.com" }
]
license = { text = "MIT" }
requires-python = ">=3.9"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Text Processing :: Linguistic",
]
keywords = [
    "nlp",
    "natural-language-processing",
    "readability",
    "pisarek-index",
    "polish-nlp",
    "european-languages",
    "text-analysis",
    "sentiment-analysis",
    "tokenization",
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.1.0",
]

[project.scripts]
writegenius = "writegenius.cli:main"

[project.urls]
Homepage = "https://github.com/spiktokmarcin-rgb/WriteGenius"
Repository = "https://github.com/spiktokmarcin-rgb/WriteGenius.git"
"Bug Tracker" = "https://github.com/spiktokmarcin-rgb/WriteGenius/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q"
testpaths = [
    "tests",
]
pythonpath = [
    "src",
]
